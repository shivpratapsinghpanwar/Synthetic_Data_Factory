[project]
name = "synthetic-data-factory"
version = "0.1.0"
description = "Synthetic medical imaging data factory with a Kaggle execution runner"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    # Local control-plane deps only. Heavy ML deps (torch, diffusers, peft)
    # come from the Kaggle image on the execution side - see docs/pipeline_design.md.
    "kaggle>=2.2.4",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaggle_runner", "sdf"]

[tool.pytest.ini_options]
testpaths = ["test"]
