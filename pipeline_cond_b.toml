# Private study B pipeline (client data - never in git). The real dataset
# identifiers live in pipeline_cond_b.local.toml (gitignored). On Kaggle,
# attach the private dataset and pass --data-root or set SDF_DATA_ROOT.

[dataset]
name = "folder_class"
kaggle_slug = "private/local-overlay"
data_root = ""
condition = "cond_b"     # study tag for the shared multi-study generator

[splits]
seed = 20260823
val_frac = 0.10          # carved from their train; their test split is honored
test_frac = 0.15         # ignored when a curated test exists
group_key = "image"

[generator]
backend = "mdx"          # default arm; sd15_lora/sdxl_lora arms via --opt backend=
base_model = "from-scratch"
prompt_template = "a clinical medical photograph of {cls}, hospital documentation image"
resolution = 256
rare_class_max_count = 0
train_steps = 4000
lr = 1e-4
batch_size = 16
grad_accum = 1
sample_count = 100
sample_steps = 60
guidance = 1.0
