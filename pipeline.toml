# Configuration for the synthetic-data pipeline (see docs/pipeline_design.md).
# The Kaggle execution side is configured separately in runner.toml.

[dataset]
name = "ham10000"
kaggle_slug = "kmader/skin-cancer-mnist-ham10000"
# Explicit local dataset root; empty auto-discovers $SDF_DATA_ROOT then /kaggle/input.
data_root = ""

[splits]
seed = 20260823
val_frac = 0.10
test_frac = 0.15
# Split by physical lesion, never by image - prevents near-duplicate leakage.
group_key = "lesion_id"

[generator]
backend = "sd15_lora"
# runwayml/stable-diffusion-v1-5 was delisted from HF; this is the maintained mirror.
base_model = "stable-diffusion-v1-5/stable-diffusion-v1-5"
resolution = 512
# Classes with fewer real *training* images than this are generation targets.
rare_class_max_count = 600
# Training defaults for full runs; smoke tests override via --opt.
train_steps = 800
lr = 1e-4
batch_size = 2
grad_accum = 2
# Sampling defaults.
sample_count = 100
sample_steps = 30
guidance = 7.5
